# PostgreSQL credentials shared by the database pod, the init Job, and the app.
#
# Preferred: create this secret yourself with a generated password instead of
# applying placeholders:
#
#   kubectl -n khaya create secret generic khaya-db-credentials \
#     --from-literal=POSTGRES_USER=khaya \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -base64 24)" \
#     --from-literal=POSTGRES_DB=khaya
#
# If you apply this file as-is, replace CHANGE_ME... before the database starts.
apiVersion: v1
kind: Secret
metadata:
  name: khaya-db-credentials
  namespace: khaya
  labels:
    app.kubernetes.io/name: khaya-db
    app.kubernetes.io/part-of: khaya
type: Opaque
stringData:
  POSTGRES_USER: khaya
  POSTGRES_PASSWORD: CHANGE_ME_GENERATE_WITH_openssl_rand
  POSTGRES_DB: khaya
